<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunity Detail | CreatorChain</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #f5f0e8; --surface: #ffffff; --black: #0a0a0a;
            --primary: #00e87a; --secondary: #ffe600; --accent: #ff3b00;
            --discord: #0057ff; --admin: #7000ff; --muted: #555555;
            --border: 3px solid #0a0a0a; --shadow: 4px 4px 0px #0a0a0a;
            --white: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); font-family: 'Space Grotesk', sans-serif; color: var(--black); overflow-x: hidden; line-height: 1.3; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .mono { font-family: 'Space Mono', monospace; text-transform: uppercase; letter-spacing: 1px; }
        
        .btn { border: var(--border); padding: 10px 20px; font-family: 'Space Mono', monospace; font-weight: 700; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: var(--shadow); border-radius: 0; font-size: 13px; }
        .btn:hover { transform: scale(1.05) translateY(-2px); box-shadow: 6px 6px 0 var(--black); }
        .btn-primary { background: var(--primary); color: var(--black); }
        .btn-black { background: var(--black); color: #fff; box-shadow: 4px 4px 0 var(--primary); }
        .btn-white { background: #fff; color: var(--black); }

        /* Opportunity Detail Styles */
        .project-detail-layout { display: grid; grid-template-columns: 320px 1fr; gap: 40px; margin-top: 30px; }
        .project-detail-sidebar { display: flex; flex-direction: column; gap: 30px; border-right: 3px solid var(--black); padding-right: 40px; }
        .sidebar-section-label { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); display: block; margin-bottom: 12px; letter-spacing: 1px; font-weight: 700; text-transform: uppercase; }
        
        .prize-pool-box { background: var(--black); color: #fff; padding: 25px; border: 4px solid var(--black); box-shadow: 8px 8px 0 var(--primary); position: relative; }
        .prize-total { font-size: 32px; font-weight: 900; margin-bottom: 20px; border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 10px; color: var(--primary); }
        .prize-total span { font-size: 12px; font-family: 'Space Mono', monospace; color: #fff; opacity: 0.7; display: block; text-transform: uppercase; }
        .prize-list { display: flex; flex-direction: column; gap: 15px; position: relative; }
        .prize-item { display: flex; justify-content: space-between; align-items: center; position: relative; padding-left: 20px; }
        .prize-item::before { content: '→'; position: absolute; left: 0; color: var(--primary); font-weight: 900; }
        .prize-rank { font-family: 'Space Mono', monospace; font-size: 12px; opacity: 0.7; text-transform: uppercase; }
        .prize-value { font-weight: 900; font-size: 18px; color: #fff; }
        .prize-item.highlight .prize-value { color: var(--primary); font-size: 22px; }

        .submission-stats { display: grid; grid-template-columns: 1fr; gap: 15px; background: #fff; padding: 20px; border: 3px solid var(--black); box-shadow: 6px 6px 0 var(--black); }
        .stat-lbl { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); text-transform: uppercase; }
        .stat-val { font-size: 24px; font-weight: 900; color: var(--black); }

        .skill-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .skill-tag { background: var(--black); color: var(--primary); padding: 5px 12px; font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; border: 2px solid var(--black); text-transform: uppercase; }

        .project-detail-main { display: flex; flex-direction: column; gap: 40px; }
        .detail-section h3 { font-size: 14px; font-weight: 900; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-family: 'Space Mono', monospace; color: var(--black); background: var(--white); border: 3px solid var(--black); padding: 8px 15px; width: fit-content; box-shadow: 4px 4px 0 var(--black); text-transform: uppercase; }
        .detail-section p { font-size: 16px; line-height: 1.6; color: #333; font-family: 'Space Grotesk', sans-serif; }
        .detail-section ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px; }
        .detail-section ul li { position: relative; padding-left: 25px; font-size: 15px; line-height: 1.5; color: #444; }
        .detail-section ul li::before { content: '→'; position: absolute; left: 0; color: var(--primary); font-weight: 900; }

        .project-detail-header { border-bottom: 4px solid var(--black); padding-bottom: 30px; margin-bottom: 10px; }
        .detail-logo { width: 100px; height: 100px; border: 4px solid var(--black); background: #fff; padding: 10px; box-shadow: 8px 8px 0 var(--black); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
        .detail-logo img { width: 100%; height: 100%; object-fit: contain; }

        .status-indicator { display: flex; align-items: center; gap: 8px; background: var(--black); color: #fff; padding: 4px 12px; border: 2px solid var(--black); width: fit-content; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-dot.active { background: var(--primary); box-shadow: 0 0 8px var(--primary); }
        .status-dot.ended { background: var(--accent); }

        /* APPLICATION MODAL (FORM) */
        .application-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: flex-start; justify-content: center; z-index: 10000; backdrop-filter: blur(8px); padding: 20px; overflow-y: auto; }
        .application-card { background: #fff; border: 4px solid var(--black); width: 100%; max-width: 500px; box-shadow: 20px 20px 0 var(--black); position: relative; margin: auto; }
        .application-header { background: var(--black); color: var(--primary); padding: 25px; border-bottom: 4px solid var(--black); }
        .application-body { padding: 30px; }
        .field { margin-bottom: 20px; }
        .field label { display: block; font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 900; margin-bottom: 8px; color: var(--black); text-transform: uppercase; }
        .field input, .field textarea { width: 100%; padding: 12px; border: 3px solid var(--black); font-family: inherit; font-size: 14px; font-weight: 600; outline: none; background: #fff; }
        .field input:focus { background: #f0fff8; border-color: var(--primary); }

        /* EXCLUSIVE EFFECTS */
        .exclusive-glow {
            border-color: #00f2ff !important;
            animation: exclusivePulse 3s infinite ease-in-out !important;
        }
        @keyframes exclusivePulse {
            0% { box-shadow: 0 0 10px rgba(0, 242, 255, 0.2), 6px 6px 0 var(--black); }
            50% { box-shadow: 0 0 25px rgba(0, 242, 255, 0.5), 8px 8px 0 var(--black); border-color: #7000ff !important; }
            100% { box-shadow: 0 0 10px rgba(0, 242, 255, 0.2), 6px 6px 0 var(--black); }
        }
        .exclusive-text {
            background: linear-gradient(90deg, #7000ff, #00f2ff, #7000ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            font-weight: 900;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }
        .exclusive-stamp {
            background: #00f2ff !important;
            color: var(--black) !important;
            border: 2px solid var(--black) !important;
            font-weight: 900 !important;
            box-shadow: 3px 3px 0 var(--black) !important;
            padding: 4px 10px;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            display: inline-block;
        }
        .exclusive-inner-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, rgba(0, 242, 255, 0.03) 0%, rgba(112, 0, 255, 0.03) 100%);
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .exclusive-inner-bg::after {
            content: "";
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0, 242, 255, 0.05) 1px, rgba(0, 242, 255, 0.05) 2px);
            animation: scanline 10s linear infinite;
        }
        @keyframes scanline {
            from { transform: translateY(0); }
            to { transform: translateY(33.33%); }
        }

        #toast { position: fixed; bottom: 30px; right: 30px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; }
        .toast-item { background: var(--black); color: #fff; padding: 14px 20px; border: 2px solid var(--primary); font-family: 'Space Mono', monospace; font-size: 13px; box-shadow: 4px 4px 0 var(--primary); }
        .toast-item.error { border-color: var(--accent); box-shadow: 4px 4px 0 var(--accent); }

        /* ===== AI COACH STYLES ===== */
        .ai-coach-btn {
            width: 100%; padding: 10px;
            background: linear-gradient(135deg, #7000ff 0%, #00f2ff 100%);
            color: #fff; border: 2px solid var(--black);
            font-family: 'Space Mono', monospace; font-weight: 900; font-size: 11px;
            text-transform: uppercase; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 3px 3px 0 var(--black);
            transition: all 0.2s ease; letter-spacing: 1px;
            position: relative; overflow: hidden;
        }
        .ai-coach-btn::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: translateX(-100%); animation: shimmer 3s infinite;
        }
        @keyframes shimmer { to { transform: translateX(100%); } }
        .ai-coach-btn:hover { transform: translateY(-1px); box-shadow: 4px 4px 0 var(--black); }
        .ai-coach-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
        .ai-coach-btn .spinner { display: none; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        .ai-coach-btn.loading .spinner { display: inline-block; }
        .ai-coach-btn.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .ai-feedback-panel {
            display: none; background: #111; border: 2px solid #7000ff;
            margin-top: 12px; overflow: hidden;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .ai-feedback-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px;
            background: linear-gradient(135deg, #7000ff, #00f2ff);
        }
        .ai-feedback-header h4 {
            color: #fff; font-family: 'Space Mono', monospace;
            font-size: 10px; margin: 0; letter-spacing: 1px;
        }
        .ai-feedback-close {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; width: 22px; height: 22px; cursor: pointer;
            font-size: 12px; font-weight: 900; display: flex;
            align-items: center; justify-content: center; transition: 0.2s;
        }
        .ai-feedback-close:hover { background: rgba(255,59,0,0.5); }

        .ai-score-badge {
            display: flex; align-items: center; gap: 8px;
        }
        .ai-score-num {
            font-family: 'Space Mono', monospace; font-weight: 900;
            font-size: 20px; color: #fff; line-height: 1;
        }
        .ai-score-num.high { color: var(--primary); }
        .ai-score-num.mid { color: var(--secondary); }
        .ai-score-num.low { color: var(--accent); }
        .ai-score-label {
            font-family: 'Space Mono', monospace; font-size: 8px;
            color: rgba(255,255,255,0.6); text-transform: uppercase;
        }

        .ai-feedback-body {
            padding: 12px 14px; color: #fff;
            max-height: 220px; overflow-y: auto;
        }
        .ai-feedback-body::-webkit-scrollbar { width: 4px; }
        .ai-feedback-body::-webkit-scrollbar-track { background: transparent; }
        .ai-feedback-body::-webkit-scrollbar-thumb { background: #7000ff; border-radius: 2px; }

        .ai-feedback-summary {
            font-size: 12px; line-height: 1.4; color: rgba(255,255,255,0.8);
            margin-bottom: 12px; padding-bottom: 10px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        .ai-meta-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .ai-meta-tag {
            padding: 2px 8px; font-family: 'Space Mono', monospace;
            font-size: 9px; font-weight: 700; text-transform: uppercase; border: 1px solid;
        }
        .ai-meta-tag.type { border-color: #00f2ff; color: #00f2ff; }
        .ai-meta-tag.match { border-color: var(--primary); color: var(--primary); }
        .ai-meta-tag.grade-a { border-color: var(--primary); color: var(--primary); }
        .ai-meta-tag.grade-b { border-color: var(--secondary); color: var(--secondary); }
        .ai-meta-tag.grade-c { border-color: #ff8800; color: #ff8800; }
        .ai-meta-tag.grade-d { border-color: var(--accent); color: var(--accent); }

        .ai-section-title {
            font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 900;
            color: #00f2ff; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px;
        }
        .ai-strengths { margin-bottom: 12px; }
        .ai-strength-item {
            color: rgba(255,255,255,0.7); font-size: 11px; margin-bottom: 4px;
            padding-left: 14px; position: relative;
        }
        .ai-strength-item::before { content: '✓'; position: absolute; left: 0; color: var(--primary); font-weight: 900; font-size: 10px; }

        .ai-tip-card {
            background: rgba(255,255,255,0.04); border-left: 2px solid;
            padding: 8px 10px; margin-bottom: 6px;
        }
        .ai-tip-card.high { border-color: var(--accent); }
        .ai-tip-card.medium { border-color: var(--secondary); }
        .ai-tip-card.low { border-color: rgba(255,255,255,0.2); }
        .ai-tip-title {
            font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 900;
            color: #fff; margin-bottom: 2px; display: flex; align-items: center; gap: 6px;
        }
        .ai-tip-title .impact { font-size: 8px; padding: 0 4px; border: 1px solid; opacity: 0.5; }
        .ai-tip-detail { font-size: 10px; color: rgba(255,255,255,0.5); line-height: 1.3; }

        .ai-pro-tip {
            background: rgba(112, 0, 255, 0.1); border: 1px solid #7000ff;
            padding: 10px; margin-top: 10px;
        }
        .ai-pro-tip-label {
            font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 900;
            color: #00f2ff; margin-bottom: 4px; text-transform: uppercase;
        }
        .ai-pro-tip p { font-size: 11px; color: rgba(255,255,255,0.7); line-height: 1.4; margin: 0; }

        @media (max-width: 900px) {
            .project-detail-layout { grid-template-columns: 1fr; }
            .project-detail-sidebar { border-right: none; padding-right: 0; border-bottom: 3px solid var(--black); padding-bottom: 40px; }
        }
    </style>
</head>
<body>

<nav style="background:var(--white); border-bottom:4px solid var(--black); padding:15px 0; position:sticky; top:0; z-index:1000;">
    <div style="max-width:1200px; margin:0 auto; padding:0 20px; display:flex; justify-content:space-between; align-items:center;">
        <a href="/" style="text-decoration:none; display:flex; align-items:center; gap:10px;">
            <img src="/logo.png" alt="Logo" style="height:44px;">
            <span style="font-weight:900; font-size:20px; color:var(--black); font-family: 'Space Mono', monospace;">CREATOR<span style="-webkit-text-stroke: 1px var(--black); color:transparent;">CHAIN</span></span>
        </a>
        <a href="/" class="btn btn-black btn-sm" style="text-decoration:none;">&larr; BACK TO FEED</a>
    </div>
</nav>

<div class="container" id="loading-state">
    <div style="padding:100px; text-align:center;">
        <h2 class="mono">🔍 DECRYPTING_OPPORTUNITY_DATA...</h2>
    </div>
</div>

<div class="container" id="detail-container" style="display:none;">
    <div id="project-detail-content">
        <!-- Content Injected -->
    </div>
</div>

<!-- APPLICATION MODAL -->
<div id="application-modal" class="application-modal" onclick="if(event.target === this) closeApplicationForm()">
    <div class="application-card" onclick="event.stopPropagation()">
        <button onclick="closeApplicationForm()" style="position:absolute; top:-20px; right:-20px; background:var(--black); color:#fff; width:40px; height:40px; border:3px solid #fff; cursor:pointer; font-weight:900; font-size:20px; z-index:100;">✕</button>
        <div class="application-header">
            <h2 class="mono" style="margin:0; font-size:24px;">SUBMIT_PROPOSAL</h2>
            <p id="app-project-name" style="margin:5px 0 0 0; font-weight:800; opacity:0.8;"></p>
        </div>
        <div class="application-body">
            <div id="auth-check-msg" style="display:none; text-align:center; padding:20px;">
                <p class="mono" style="font-size:14px; margin-bottom:20px;">AUTHENTICATION_REQUIRED_TO_SUBMIT</p>
                <button onclick="signInWithX()" class="btn btn-black" style="width:100%;"><i data-lucide="twitter"></i> SIGN_IN_WITH_X</button>
            </div>
            
            <form id="proposal-form" onsubmit="handleProposalSubmit(event)">
                <input type="hidden" id="app-opportunity-id">
                
                <div id="dynamic-fields-container"></div>

                <!-- AI COACH BUTTON -->
                <div class="field">
                    <button type="button" id="ai-coach-btn" class="ai-coach-btn" onclick="runAICoach()">
                        <span class="spinner"></span>
                        <span class="btn-text">🤖 AI COACH — ANALYZE BEFORE SUBMITTING</span>
                    </button>
                    <p style="font-size:10px; color:var(--muted); margin-top:5px; text-align:center;">Paste your submission link above, then click to get AI-powered feedback & win probability.</p>
                    
                    <!-- AI FEEDBACK PANEL -->
                    <div id="ai-feedback-panel" class="ai-feedback-panel"></div>
                </div>

                <div class="field">
                    <label>TELEGRAM_USERNAME <span style="color:var(--accent)">*</span></label>
                    <input type="text" id="app-telegram" placeholder="@username" required>
                </div>

                <div class="field">
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                        <input type="checkbox" required style="width:20px; height:20px;">
                        <span style="font-size:11px; line-height:1.2;">I have followed the official project account and tagged @tmbfun in my post.</span>
                    </label>
                </div>

                <div class="field">
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                        <input type="checkbox" required style="width:20px; height:20px;">
                        <span style="font-size:11px; line-height:1.2;">I agree to grant the project permanent worldwide commercial usage rights for this content.</span>
                    </label>
                </div>

                <button type="submit" id="submit-proposal-btn" class="btn btn-primary" style="width:100%; padding:18px; font-weight:900; font-size:18px; box-shadow:10px 10px 0 var(--black);">SEND_SUBMISSION &rarr;</button>
            </form>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    const SUPABASE_URL = 'https://mwefmtmcljdsptcgowmb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_SdGsB-hhvxF2-rq_fBiM0A_y3_mQn2n';
    let db, currentUser = null;

    async function initSupabase() {
        try {
            const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
            db = createClient(SUPABASE_URL, SUPABASE_KEY);
            return true;
        } catch (e) {
            console.error('Supabase init failed:', e);
            return false;
        }
    }

    async function init() {
        if (!await initSupabase()) return;

        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        if (!id) {
            window.location.href = '/';
            return;
        }

        const { data: { user } } = await db.auth.getUser();
        currentUser = user;
        if (user) {
            updateUIForUser(user);
        } else {
            // Optional: You could openAuthModal() here if you want to force sign-in on page load
            // openAuthModal();
        }

        const { data: item, error } = await db.from('opportunities').select('*').eq('id', id).single();
        
        if (error || !item) {
            const { data: listData, error: listError } = await db.from('listings').select('*').eq('id', id).single();
            if (listError || !listData) {
                document.getElementById('loading-state').innerHTML = '<div style="padding:100px; text-align:center;"><h2 class="mono">⚠️ OPPORTUNITY_NOT_FOUND</h2><a href="/" class="btn btn-primary">RETURN_HOME</a></div>';
                return;
            }
            renderDetail(listData);
        } else {
            item.is_exclusive = true;
            item.project = item.project_name;
            renderDetail(item);
        }
    }


    function renderDetail(item) {
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('detail-container').style.display = 'block';

        const parseReward = (str) => {
            if(!str) return 0;
            const num = str.replace(/[^0-9]/g, '');
            return parseInt(num) || 0;
        };

        const prizeNumeric = parseReward(item.reward);
        const prizeTotal = item.reward || 'TBA';
        
        const isClosed = item.status === 'closed';
        const isEnded = item.status === 'ended' || isClosed || (item.deadline && new Date(item.deadline) < new Date());
        const logoHtml = item.logo ? `<img src="${item.logo}" onerror="this.src='/logo.png'">` : `<img src="/logo.png" style="opacity:0.5; object-fit:contain;">`;

        const skillsList = (item.skills || 'Community, Content, Growth').split(',').map(s => s.trim());
        
        // Dynamic Prize Tiers
        const prizes = [
            { label: '1st Prize', value: item.prize_breakdown?.first || (prizeNumeric ? '$'+Math.round(prizeNumeric*0.5) : '') },
            { label: '2nd Prize', value: item.prize_breakdown?.second || (prizeNumeric ? '$'+Math.round(prizeNumeric*0.3) : '') },
            { label: '3rd Prize', value: item.prize_breakdown?.third || (prizeNumeric ? '$'+Math.round(prizeNumeric*0.2) : '') },
            { label: '4th Prize', value: item.prize_breakdown?.fourth || '' },
            { label: '5th Prize', value: item.prize_breakdown?.fifth || '' }
        ].filter(p => p.value);
        
        const prizesHtml = prizes.map((p, idx) => `
            <div class="prize-item ${idx === 0 ? 'highlight' : ''}">
                <span class="prize-rank">${p.label}</span>
                <span class="prize-value">${p.value}</span>
            </div>
        `).join('');
        
        const hasTiers = prizes.length > 0;

        const scopeHtml = item.scope_requirements

        setTimeout(() => el.remove(), 4000);

    async function handleProposalSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-proposal-btn');
        btn.disabled = true;
        btn.textContent = 'SENDING_PROPOSAL...';

        if (!currentUser) {
            alert('Session expired. Please sign in.');
            location.reload();
            return;
        }

        const opportunity_id = document.getElementById('app-opportunity-id').value;
        const link = document.getElementById('app-link') ? document.getElementById('app-link').value : '';
        const telegram = document.getElementById('app-telegram').value;
        
        // Collect dynamic fields if they exist
        const wallet = document.getElementById('app-wallet') ? document.getElementById('app-wallet').value : undefined;
        const name = document.getElementById('dyn-name') ? document.getElementById('dyn-name').value : undefined;
        const experience = document.getElementById('dyn-experience') ? document.getElementById('dyn-experience').value : undefined;
        const portfolio = document.getElementById('dyn-portfolio') ? document.getElementById('dyn-portfolio').value : undefined;
        const about = document.getElementById('dyn-about') ? document.getElementById('dyn-about').value : undefined;
        const projectLink = document.getElementById('dyn-project-link') ? document.getElementById('dyn-project-link').value : undefined;

        const payload = {
            opportunity_id,
            user_id: currentUser.id,
            portfolio_links: link,
            message: JSON.stringify({ 
                telegram, 
                wallet_address: wallet,
                name,
                experience,
                portfolio,
                about,
                projectLink,
                submitted_at: new Date().toISOString(),
                user_handle: currentUser.user_metadata.user_name || currentUser.email,
                email: currentUser.email
            }),
            status: 'pending'
        };

        const { error } = await db.from('applications').insert([payload]);

        if (error) {
            alert('Failed: ' + error.message);
        } else {
            // Track community submission on the user's profile
            try {
                const userEmail = currentUser.email;
                if (userEmail) {
                    const { data: profile } = await db
                        .from('user_profiles')
                        .select('id, total_submissions, reputation_score, score')
                        .eq('email', userEmail)
                        .maybeSingle();
                    
                    if (profile) {
                        const newTotal = (profile.total_submissions || 0) + 1;
                        const newReputation = (profile.reputation_score || 0) + 1;
                        
                        await db.from('user_profiles')
                            .update({ 
                                total_submissions: newTotal,
                                reputation_score: newReputation,
                                score: newReputation
                            })
                            .eq('id', profile.id);
                    }
                }
            } catch (trackErr) { console.warn('Submission tracking failed:', trackErr); }

            alert('🚀 Proposal sent successfully!');
            closeApplicationForm();
        }
        
        btn.disabled = false;
        btn.textContent = 'SEND_SUBMISSION &rarr;';
    }

    // ===== AI SUBMISSION COACH =====
    let currentOpportunityData = null;

    // Patch renderDetail to store opportunity data for AI Coach
    const _originalRenderDetail = renderDetail;
    renderDetail = function(item) {
        currentOpportunityData = item;
        _originalRenderDetail(item);
    };

    async function runAICoach() {
        const link = document.getElementById('app-link').value.trim();
        const btn = document.getElementById('ai-coach-btn');
        const panel = document.getElementById('ai-feedback-panel');

        if (!link) {
            showToast('Paste your submission link first!', 'error');
            document.getElementById('app-link').focus();
            return;
        }

        // Loading state
        btn.classList.add('loading');
        btn.disabled = true;
        panel.style.display = 'none';

        try {
            const payload = {
                submission_link: link,
                opportunity_title: currentOpportunityData?.title || '',
                opportunity_description: currentOpportunityData?.mission || currentOpportunityData?.description || '',
                skills_required: currentOpportunityData?.skills || '',
                reward: currentOpportunityData?.reward || ''
            };

            const resp = await fetch('/api/analyze-submission', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await resp.json();
            const analysis = data.analysis || data.fallback;

            if (analysis) {
                renderAIFeedback(analysis);
            } else {
                showToast('AI Coach could not analyze. Submit anyway!', 'error');
            }
        } catch (err) {
            console.error('AI Coach error:', err);
            showToast('AI Coach unavailable. You can still submit!', 'error');
        } finally {
            btn.classList.remove('loading');
            btn.disabled = false;
        }
    }

    function renderAIFeedback(a) {
        const panel = document.getElementById('ai-feedback-panel');
        const prob = a.win_probability || 45;
        const scoreClass = prob >= 65 ? 'high' : prob >= 40 ? 'mid' : 'low';
        const gradeClass = (a.quality_grade || 'B').toLowerCase();

        const strengthsHtml = (a.strengths || []).map(s => 
            `<div class="ai-strength-item">${s}</div>`
        ).join('');

        const tipsHtml = (a.improvements || []).map(tip => `
            <div class="ai-tip-card ${tip.impact || 'medium'}">
                <div class="ai-tip-title">
                    ${tip.tip}
                    <span class="impact">${(tip.impact || 'medium').toUpperCase()}</span>
                </div>
                <div class="ai-tip-detail">${tip.detail}</div>
            </div>
        `).join('');

        panel.innerHTML = `
            <div class="ai-feedback-header">
                <div style="display:flex;align-items:center;gap:10px;">
                    <h4>🤖 AI_COACH</h4>
                    <div class="ai-score-badge">
                        <span class="ai-score-num ${scoreClass}">${prob}%</span>
                        <span class="ai-score-label">WIN<br>PROB</span>
                    </div>
                </div>
                <button class="ai-feedback-close" onclick="closeAIFeedback()">✕</button>
            </div>
            <div class="ai-feedback-body">
                <div class="ai-meta-row">
                    <span class="ai-meta-tag type">${a.content_type_label || a.content_type || 'Content'}</span>
                    <span class="ai-meta-tag match">${(a.platform_match || 'moderate').toUpperCase()}</span>
                    <span class="ai-meta-tag grade-${gradeClass}">Grade ${a.quality_grade || 'B'}</span>
                </div>

                <div class="ai-feedback-summary">
                    ${a.feedback_summary || 'Analysis complete.'}
                </div>

                ${strengthsHtml ? `
                    <div class="ai-strengths">
                        <div class="ai-section-title">✓ Strengths</div>
                        ${strengthsHtml}
                    </div>
                ` : ''}

                ${tipsHtml ? `
                    <div>
                        <div class="ai-section-title">⚡ Improve</div>
                        ${tipsHtml}
                    </div>
                ` : ''}

                ${a.pro_tip ? `
                    <div class="ai-pro-tip">
                        <div class="ai-pro-tip-label">💎 PRO TIP</div>
                        <p>${a.pro_tip}</p>
                    </div>
                ` : ''}
            </div>
        `;

        panel.style.display = 'block';
    }

    function closeAIFeedback() {
        document.getElementById('ai-feedback-panel').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
